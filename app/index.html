/* ===== Schedule Module ===== */
const Schedule = {
  cats:['生活','健康','社交','学习','旅行','其他'],
  render(){
    const all=Data.schedules.all();
    const today=todayStr();
    
    // Group: overdue, today, this week, later
    const overdue=all.filter(s=>s.date<today&&!s.done).sort((a,b)=>a.date<b.date?-1:1);
    const todayItems=all.filter(s=>s.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const weekEnd=addDays(today,7);
    const weekItems=all.filter(s=>s.date>today&&s.date<=weekEnd&&!s.done).sort((a,b)=>a.date<b.date?-1:1);
    const later=all.filter(s=>s.date>weekEnd&&!s.done).sort((a,b)=>a.date<b.date?-1:1);
    
    let html=`<div class="flex-between mb-4">
      <h2 class="section-title" style="margin:0">日程统筹</h2>
      <button class="btn btn-primary btn-sm" onclick="Schedule.add()">${I.plus}添加</button>
    </div>`;
    
    if(!all.length){
      html+=`<div class="empty-state">${I.empty}<p>暂无日程</p></div>`;
    }else{
      if(overdue.length)html+=this._group('逾期未完成',overdue,'overdue');
      if(todayItems.length)html+=this._group('今天',todayItems,'');
      if(weekItems.length)html+=this._group('本周内',weekItems,'');
      if(later.length)html+=this._group('更远',later,'');
    }
    $('#tab-schedule').innerHTML=html;
  },
  _group(title,items,cls){
    return `<div class="sched-group">
      <div class="sched-group-title ${cls}"><span>${title}</span><span class="group-count">${items.length}</span></div>
      ${items.map(s=>`<div class="sched-item ${cls==='overdue'?'overdue':''}">
        <div class="sched-cat" style="background:${SCHED_CAT_COLORS[s.category]||'#71717A'}"></div>
        <div class="sched-check ${s.done?'done':''}" onclick="Schedule.toggle('${s.id}')">${I.check}</div>
        <div class="sched-body"><p class="${s.done?'done':''}">${s.title}</p><span>${fmtDate(s.date)}${s.time?' · '+s.time:''} · ${s.category}</span></div>
        <button class="sched-del" onclick="Schedule.del('${s.id}')">${I.trash}</button>
      </div>`).join('')}
    </div>`;
  },
  add(){
    UI.modal('添加日程',`
      <div class="field"><label>标题</label><input type="text" class="input" id="sc-title" placeholder="如 开会、体检、朋友聚餐" autofocus></div>
      <div class="field-row">
        <div class="field"><label>日期</label><input type="date" class="input" id="sc-date" value="${todayStr()}"></div>
        <div class="field"><label>时间</label><input type="time" class="input" id="sc-time"></div>
      </div>
      <div class="field"><label>分类</label><div style="display:flex;flex-wrap:wrap;gap:6px" id="sc-cat-list">
        ${this.cats.map((c,i)=>`<button class="filter-chip ${i===0?'active':''}" onclick="Schedule._selCat('${c}',this)">${c}</button>`).join('')}
      </div></div>
      <button class="btn btn-primary w-full" onclick="Schedule._save()">添加</button>
    `);
    this._scCat=this.cats[0];

  _selCat(cat,el){this._scCat=cat;$$('#sc-cat-list .filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');},
  _save(){
    const title=$('#sc-title').value.trim();

/* ===== Media Module ===== */
const Media = {
  types:['书籍','电影','剧集','音乐'],
  statuses:{'书籍':['想读','在读','已读'],'电影':['想看','在看','已看'],'剧集':['想看','在看','已看'],'音乐':['想听','在听','已听']},
  view:'wall',
  filter:'all',
  render(){
    const all=Data.media.all();
    const year=new Date().getFullYear();
    const yearItems=all.filter(m=>(m.dateAdded||'').slice(0,4)==String(year));
    const yearByType={};
    this.types.forEach(t=>yearByType[t]=yearItems.filter(m=>m.type===t&&m.status.startsWith('已')).length);
    const avgRating=yearItems.filter(m=>m.rating>0).length?(yearItems.filter(m=>m.rating>0).reduce((s,m)=>s+m.rating,0)/yearItems.filter(m=>m.rating>0).length).toFixed(1):'--';
    
    let filtered=all;
    if(this.filter!=='all')filtered=all.filter(m=>m.type===this.filter);
    
    let html=`<div class="flex-between mb-4">
      <h2 class="section-title" style="margin:0">书影音收藏</h2>
      <button class="btn btn-primary btn-sm" onclick="Media.add()">${I.plus}添加</button>
    </div>`;
    
    // Stats
    html+=`<div class="media-stats">
      ${this.types.map(t=>`<div class="media-stat"><div class="ms-val">${yearByType[t]}</div><div class="ms-label">${t}</div></div>`).join('')}
      <div class="media-stat" style="grid-column:span ${4-this.types.length}">
        <div class="ms-val">${avgRating}</div><div class="ms-label">平均评分</div>
      </div>
    </div>`;
    
    // Toolbar
    html+=`<div class="media-toolbar">
      <button class="filter-chip ${this.filter==='all'?'active':''}" onclick="Media.setFilter('all')">全部</button>
      ${this.types.map(t=>`<button class="filter-chip ${this.filter===t?'active':''}" onclick="Media.setFilter('${t}')">${t}</button>`).join('')}
      <span style="flex:1"></span>
      <button class="filter-chip ${this.view==='wall'?'active':''}" onclick="Media.setView('wall')">封面墙</button>
      <button class="filter-chip ${this.view==='list'?'active':''}" onclick="Media.setView('list')">列表</button>
    </div>`;
    
    if(!filtered.length){
      html+=`<div class="empty-state">${I.empty}<p>收藏夹空空如也</p></div>`;
    }else{
      if(this.view==='wall'){
        html+='<div class="media-wall">';
        filtered.forEach(m=>{
          const grad=this._gradient(m.title);
          const stars=[1,2,3,4,5].map(i=>`<svg class="${i<=m.rating?'filled':''}" viewBox="0 0 24 24">${I.star}</svg>`).join('');
          html+=`<div class="media-cover" onclick="Media.detail('${m.id}')">
            <div class="cover-bg" style="background:${grad}"><p>${m.title}</p></div>
            <span class="cover-badge">${m.type}</span>
            ${m.rating>0?`<div class="cover-stars">${stars}</div>`:''}
          </div>`;
        });
        html+='</div>';
      }else{
        filtered.forEach(m=>{
          const grad=this._gradient(m.title);
          const stars=[1,2,3,4,5].map(i=>`<svg class="${i<=m.rating?'filled':''}" viewBox="0 0 24 24" style="width:12px;height:12px;color:var(--text-4)">${I.star}</svg>`).join('');
          html+=`<div class="media-list-item" onclick="Media.detail('${m.id}')">
            <div class="media-list-cover" style="background:${grad}"><p>${m.title.slice(0,4)}</p></div>
            <div class="media-list-body">
              <p>${m.title}</p>
              <div class="ml-meta">${m.type} · ${m.status} · ${m.year||''}</div>
              <div class="media-list-stars">${stars}</div>
              ${m.review?`<div class="ml-review">${m.review}</div>`:''}
            </div>
          </div>`;
        });
      }
    }
    $('#tab-media').innerHTML=html;
  },
  _gradient(title){
    let hash=0;
    for(let i=0;i<title.length;i++)hash=title.charCodeAt(i)+((hash<<5)-hash);
    const h1=Math.abs(hash)%360;
    const h2=(h1+40)%360;
    return `linear-gradient(135deg,hsl(${h1},55%,50%),hsl(${h2},55%,40%))`;
  },
  setFilter(f){this.filter=f;this.render();},
  setView(v){this.view=v;this.render();},
  add(){
    UI.modal('添加收藏',`
      <div class="field"><label>标题</label><input type="text" class="input" id="md-title" placeholder="书名/电影名/专辑名" autofocus></div>
      <div class="field-row">
        <div class="field"><label>类型</label><select class="select" id="md-type" onchange="Media._onType()">${this.types.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
        <div class="field"><label>状态</label><select class="select" id="md-status"></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>年份</label><input type="number" class="input" id="md-year" placeholder="如 2024"></div>
        <div class="field"><label>评分</label>
          <div class="star-input" id="md-stars">${[1,2,3,4,5].map(i=>`<svg data-val="${i}" viewBox="0 0 24 24">${I.star}</svg>`).join('')}</div>
        </div>
      </div>
      <div class="field"><label>短评</label><textarea class="textarea" id="md-review" placeholder="记录你的感受..."></textarea></div>
      <button class="btn btn-primary w-full" onclick="Media._save()">添加</button>
    `);
    this._onType();
    this._rating=0;
    $$('#md-stars svg').forEach(s=>{
      s.addEventListener('click',()=>{
        this._rating=parseInt(s.dataset.val);
        $$('#md-stars svg').forEach((s2,i)=>s2.classList.toggle('filled',i<this._rating));
      });
    });
  },
  _onType(){
    const type=$('#md-type').value;
    const stats=this.statuses[type];
    $('#md-status').innerHTML=stats.map(s=>`<option value="${s}">${s}</option>`).join('');
  },
  _save(){
    const title=$('#md-title').value.trim();
    if(!title){UI.toast('请输入标题','error');return;}
    Data.media.add({
      title,type:$('#md-type').value,status:$('#md-status').value,
      year:parseInt($('#md-year').value)||null,rating:this._rating||0,
      review:$('#md-review').value.trim()
    });
    UI.closeModal();App.render();UI.toast('已添加','success');
  },
  detail(id){
    const m=Data.media.all().find(x=>x.id===id);
    if(!m)return;
    const grad=this._gradient(m.title);
    const stars=[1,2,3,4,5].map(i=>`<svg class="${i<=m.rating?'filled':''}" viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--text-4)">${I.star}</svg>`).join('');
    UI.modal(m.title,`
      <div style="display:flex;gap:14px;margin-bottom:16px">
        <div style="width:80px;height:108px;border-radius:8px;background:${grad};display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <p style="color:#fff;font-size:12px;font-weight:700;text-align:center;padding:8px;line-height:1.3">${m.title}</p>
        </div>
        <div style="flex:1">
          <h3 style="font-size:18px;font-weight:700;margin-bottom:4px">${m.title}</h3>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:4px">${m.type} · ${m.status}</p>
          ${m.year?`<p style="font-size:13px;color:var(--text-3);margin-bottom:6px">${m.year}年</p>`:''}
          <div style="display:flex;gap:2px">${stars}</div>
        </div>
      </div>
      ${m.review?`<div style="background:var(--surface-2);border-radius:8px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.6;color:var(--text-2)">${m.review}</div>`:''}
      <p style="font-size:12px;color:var(--text-3);margin-bottom:12px">添加于 ${fmtDate(m.dateAdded)}</p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary flex-1" onclick="Media._editStatus('${m.id}')">改状态</button>
        <button class="btn btn-secondary" style="background:var(--expense-bg);color:var(--expense)" onclick="Media._del('${m.id}')">删除</button>
      </div>
    `);
  },
  _editStatus(id){
    const m=Data.media.all().find(x=>x.id===id);
    if(!m)return;

    UI.closeModal();

        <div style="display:flex;gap:8px" id="md-status-list">
          ${stats.map(s=>`<button class="filter-chip ${s===m.status?'active':''}" onclick="Media._setStatus('${id}','${s}')">${s}</button>`).join('')}
        </div>
      </div>
    `);
  },
  _setStatus(id,status){
    Data.media.update(id,{status});
    UI.closeModal();App.render();UI.toast('状态已更新','success');
  },
  _del(id){
    UI.confirm('删除这条收藏？',()=>{Data.media.del(id);UI.closeModal();App.render();UI.toast('已删除','success');});
  }
};

/* ===== Backup ===== */
const Backup = {
  exportJSON(){
    const data={};
    ['transactions','habits','habit_logs','fitness','fitness_cal','schedules','shopping','media','runs','shoes','budget','fitness_goal','week_plan','demo_loaded'].forEach(k=>{
      const raw=localStorage.getItem(PREFIX+k);
      if(raw)data[k]=JSON.parse(raw);
    });
    data._exportDate=new Date().toISOString();
    data._version=1;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`生活工作台_备份_${todayStr()}.json`;a.click();
    URL.revokeObjectURL(url);
    UI.toast('备份已导出','success');
  },
  importJSON(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(typeof data!=='object'||data===null)throw new Error('格式错误');
        let count=0;
        ['transactions','habits','habit_logs','fitness','fitness_cal','schedules','shopping','media','runs','shoes','budget','fitness_goal','week_plan'].forEach(k=>{
          if(data[k]!==undefined){
            try{
              localStorage.setItem(PREFIX+k,JSON.stringify(data[k]));
              count++;
            }catch(err){
              console.error('导入失败:'+k,err);
            }
          }
        });
        UI.toast(`成功导入 ${count} 类数据`,'success');
        App.render();
      }catch(err){
        UI.toast('文件格式错误，无法导入：'+err.message,'error');
      }
    };
    reader.readAsText(file);
  }
};

      if(Math.random()>0.3)Data.habits.log(h2.id,d,1);
      if(Math.random()>0.5)Data.habits.log(h3.id,d,Math.floor(Math.random()*20+15));
    }
    
    // Fitness
    Data.fitness.add({date:y7,weight:72.5,bodyFat:22.0});
    Data.fitness.add({date:addDays(t,-6),weight:72.2,bodyFat:21.5});
    Data.fitness.add({date:y3,weight:71.8,bodyFat:21.2});
    Data.fitness.add({date:y,weight:71.5,bodyFat:20.8});
    Data.fitness.setGoal({height:172,targetWeight:68,targetBodyFat:18,dailyCalTarget:1800});
    Data.fitness.addCal({date:y,intake:1600});
    Data.fitness.addCal({date:t,intake:1450});
    
    // Schedules
    Data.schedules.add({title:'还图书馆的书',date:y2,time:'10:00',category:'生活',done:false}); // overdue
    Data.schedules.add({title:'健身房训练',date:t,time:'19:00',category:'健康',done:false});
    Data.schedules.add({title:'给妈妈打电话',date:t,time:'20:30',category:'生活',done:false});
    Data.schedules.add({title:'和朋友看电影',date:addDays(t,1),time:'19:30',category:'社交',done:false});
    Data.schedules.add({title:'看牙医',date:addDays(t,3),time:'14:00',category:'健康',done:false});
    
    // Shopping
    Data.shopping.add({name:'牛奶',price:15,priority:'high',category:'食品',note:'低脂',bought:false});
    Data.shopping.add({name:'全麦面包',price:12,priority:'medium',category:'食品',bought:false});
    Data.shopping.add({name:'Type-C充电线',price:29,priority:'high',category:'电子',bought:false});
    Data.shopping.add({name:'笔记本',price:25,priority:'low',category:'图书',bought:true});
    
    // Media
    Data.media.add({title:'活着',type:'书籍',status:'已读',year:1993,rating:5,review:'余华用最平静的语调写了最残酷的命运，读完久久不能平静。'});
    Data.media.add({title:'奥本海默',type:'电影',status:'已看',year:2023,rating:5,review:'诺兰的杰作，三小时全程沉浸。'});
    Data.media.add({title:'三体',type:'书籍',status:'在读',year:2008,rating:4,review:'每次重读都有新的理解。'});
    Data.media.add({title:'Kind of Blue',type:'音乐',status:'已听',year:1959,rating:5,review:'爵士乐的巅峰之作，深夜必听。'});
    
    this._demoRuns();
    Data.setDemoLoaded(true);
    Store.set('demo_version',2);
  },
  _demoRuns(){
    const t=todayStr();
    const shoe1=Data.shoes.add({name:'Nike Pegasus 40',startKm:120,targetKm:500});
    Data.runs.add({date:addDays(t,-13),distance:5.0,duration:30,note:'恢复跑',shoeId:shoe1.id});
    Data.runs.add({date:addDays(t,-10),distance:6.2,duration:35,note:'',shoeId:shoe1.id});
    Data.runs.add({date:addDays(t,-7),distance:8.0,duration:44,note:'周末长距离',shoeId:shoe1.id});
    Data.runs.add({date:addDays(t,-4),distance:5.5,duration:31,note:'夜跑',shoeId:shoe1.id});
    Data.runs.add({date:addDays(t,-2),distance:10.0,duration:58,note:'状态不错',shoeId:shoe1.id});
  },
  migrate(){
    // v1 -> v2：v1 演示数据日期异常且含工作内容，直接重置为 v2 正确版本
    if(Store.get('demo_version',Data.demoLoaded()?1:2)>=2)return;
    ['transactions','habits','habit_logs','fitness','fitness_cal','schedules','shopping','media','runs','shoes','budget','fitness_goal','week_plan','demo_loaded'].forEach(k=>Store.remove(k));
    this.load();
    Store.set('demo_version',2);
    UI.toast('已更新：移除工作内容、新增跑步模块，演示数据已重置','success');
  },
  clear(){
    ['transactions','habits','habit_logs','fitness','fitness_cal','schedules','shopping','media','runs','shoes','budget','fitness_goal','week_plan','demo_loaded','demo_version'].forEach(k=>Store.remove(k));
    Store.set('demo_loaded',true); // 阻止重新注入演示数据
    Store.set('demo_version',2);
  }
};

/* ===== App ===== */
const App = {
  init(){
    // Migrate old data, then load demo data on first visit
    Demo.migrate();
    Demo.load();
    
    // Tab switching
    $$('.tab').forEach(t=>{
      t.addEventListener('click',()=>UI.switchTab(t.dataset.tab));
    });
    
    // File import
    $('#import-file').addEventListener('change',e=>{
      if(e.target.files[0])Backup.importJSON(e.target.files[0]);
      e.target.value='';
    });
    
    // Render all
    this.render();
    this.checkBackupReminder();
    
    // Check backup reminder periodically
    setInterval(()=>this.checkBackupReminder(),30000);
  },
  render(){
    Today.render();
    Finance.render();
    Habits.render();
    Fitness.render();
    Run.render();
    Schedule.render();
    Shopping.render();
    Media.render();
    this.checkBackupReminder();
  },
  checkBackupReminder(){
    const total=Store.totalItems();
    const banner=$('#backup-banner');
    if(total>=20){
      banner.classList.remove('hidden');
      banner.innerHTML=`${I.alert}<span>数据已积累 ${total} 条，建议导出备份以防丢失</span><button onclick="Backup.exportJSON()">立即备份</button>`;
    }else{
      banner.classList.add('hidden');
    }
  }
};

// PWA：离线缓存 + 安装引导（本地预览无 sw.js 时静默跳过）
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window._deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._deferredInstall=e;});

// Start
App.init();
</script>
</body>
</html>
